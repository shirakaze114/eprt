<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>{{ title }}</title>
  <style>
    @page {
      size: A4 portrait;
      margin: 2cm;
    }

    * {
      box-sizing: border-box;
    }

    body {
      color: #111;
      font-family: "Sarasa UI SC", "Noto Sans CJK SC", "Source Han Sans SC", sans-serif;
      font-size: 11pt;
      line-height: 1.5;
      margin: 0;
    }

    .document-body p {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      margin: 0.5em 0;
    }

    .document-body p:first-child {
      margin-top: 0;
    }

    .title-block {
      border-top: 1px solid #111;
      border-bottom: 1px solid #111;
      margin: 0 0 1.5em;
      padding: 0.6em 0 0.5em;
    }

    .title-block h1 {
      font-size: 16pt;
      font-weight: 600;
      letter-spacing: 0.05em;
      line-height: 1.3;
      margin: 0 0 0.3em;
      overflow-wrap: anywhere;
    }

    .meta-row {
      display: flex;
      justify-content: space-between;
      font-family: "Sarasa Mono SC", "Sarasa UI SC", "Menlo", "Monaco", monospace;
      font-size: 9pt;
      letter-spacing: 0.02em;
    }
  </style>
</head>
<body>
  <header class="title-block">
    <h1>{{ title }}</h1>
    <div class="meta-row">
      <span>AUTHOR: {{ author }} @ {{ ip }}</span>
      <span>DATE: {{ date }}</span>
    </div>
  </header>
  <main class="document-body">
    {% for paragraph in paragraphs %}
    <p>{{ paragraph }}</p>
    {% endfor %}
  </main>
</body>
</html>
